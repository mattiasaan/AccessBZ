# Blueprint Render: crea il backend FastAPI e un database PostgreSQL gratuito.
# Su Render: New > Blueprint > scegli il repository. Poi imposta ORS_API_KEY.
services:
  - type: web
    name: accessbz-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ORS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: accessbz-db
          property: connectionString

databases:
  - name: accessbz-db
    plan: free
