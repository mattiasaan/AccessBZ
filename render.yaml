# Blueprint Render: crea il backend FastAPI e un database PostgreSQL gratuito.
# Su Render: New > Blueprint > scegli il repository. Poi imposta ORS_API_KEY.
services:
  - type: web
    name: accessbz-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    # --retries/--timeout: se il download da PyPI è lento o si interrompe, pip riprova invece di fallire
    buildCommand: pip install --retries 10 --timeout 120 --progress-bar off -r requirements.txt "psycopg[binary]>=3.2.3,<4"
    # Il popolamento gira in background: rigenera i dati di esempio solo se hanno più di 12 ore
    # (le segnalazioni degli utenti veri non vengono toccate) e non rallenta l'avvio del server.
    # Parte dopo 10 s: al primo avvio il server crea le tabelle da solo, così i due processi
    # non provano a crearle insieme su PostgreSQL (uno dei due andrebbe in errore).
    startCommand: >-
      (sleep 10; python populate.py --refresh-if-stale 12) &
      exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --no-server-header --limit-concurrency 64 --timeout-keep-alive 5
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      # Render ha un proxy davanti al server: l'IP reale è l'ultimo di X-Forwarded-For
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ORS_DAILY_BUDGET
        value: "1500"
      - key: ORS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: accessbz-db
          property: connectionString

databases:
  - name: accessbz-db
    plan: free
    region: frankfurt
